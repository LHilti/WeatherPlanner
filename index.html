<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WeatherPlanner</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside id="panel">
    <h1>⛅ WeatherPlanner</h1>
    <p class="sub">Wo ist am Wochenende das Wetter für deine Aktivität am besten?</p>

    <section>
      <label for="q">Standort</label>
      <form id="search" autocomplete="off">
        <input id="q" placeholder="Ort eingeben, z. B. München" required>
        <button type="submit">Suchen</button>
        <button type="button" id="locate" title="Meinen Standort verwenden">📍</button>
      </form>
      <ul id="results" hidden></ul>
      <div id="center-label" class="muted">Tipp: Klick auf die Karte setzt den Standort.</div>
    </section>

    <section>
      <label>Umkreis</label>
      <div class="seg" id="radius">
        <button data-v="100">100 km</button>
        <button data-v="200" class="on">200 km</button>
        <button data-v="300">300 km</button>
      </div>
    </section>

    <section>
      <label>Zeitraum</label>
      <select id="week">
        <option value="0">Nächstes Wochenende</option>
        <option value="1">Übernächstes Wochenende</option>
      </select>
      <div class="checks">
        <label><input type="checkbox" id="fri"> + Freitag</label>
        <label><input type="checkbox" id="mon"> + Montag</label>
      </div>
      <div id="dates" class="muted"></div>
    </section>

    <section>
      <label>Aktivität</label>
      <div class="seg wrap" id="activity"></div>
      <div id="hint" class="muted"></div>
    </section>

    <section>
      <label for="min">Mindest-Score: <b id="min-val">50</b></label>
      <input type="range" id="min" min="0" max="90" step="5" value="50">
      <div class="legend"><span>schlecht</span><i></i><span>top</span></div>
    </section>

    <section>
      <label>Beste Orte</label>
      <ol id="top"></ol>
    </section>

    <div id="status" class="muted"></div>
    <footer>Wetterdaten: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> · Karte: © OpenStreetMap</footer>
  </aside>
  <main id="map"></main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
